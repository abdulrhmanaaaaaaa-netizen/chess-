<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPT Chat - يعمل</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px}
.app{width:100%;max-width:700px;height:92vh;background:#1e293b;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.6)}
.header{padding:12px 16px;background:#0f172a;border-bottom:1px solid #334155;display:flex;flex-direction:column;gap:8px;align-items:center}
.header h1{font-size:1.05rem;color:#38bdf8}
.header select{padding:6px 12px;border-radius:8px;border:1px solid #475569;background:#1e293b;color:#e2e8f0;font-size:.85rem;outline:none;width:200px;text-align:center}
.quota{font-size:.72rem;color:#64748b}
.chat-box{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.message{padding:10px 14px;border-radius:12px;max-width:85%;line-height:1.6;font-size:.95rem;white-space:pre-wrap;word-wrap:break-word}
.message.user{background:#2563eb;color:#fff;align-self:flex-start;border-bottom-right-radius:4px}
.message.ai{background:#334155;align-self:flex-end;border-bottom-left-radius:4px}
.message.error{background:#7f1d1d;color:#fca5a5;align-self:center;text-align:center;font-size:.82rem}
.typing{color:#94a3b8;font-size:.85rem;padding:0 16px 8px;display:none}
.typing.show{display:block}
.input-area{padding:12px;background:#0f172a;border-top:1px solid #334155;display:flex;gap:8px}
.input-area input{flex:1;padding:12px 16px;border-radius:10px;border:1px solid #475569;background:#1e293b;color:#e2e8f0;font-size:1rem;outline:none}
.input-area button{padding:12px 22px;border-radius:10px;border:none;background:#38bdf8;color:#0f172a;font-weight:bold;font-size:1rem;cursor:pointer}
.input-area button:disabled{background:#475569;color:#94a3b8;cursor:not-allowed}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>🤖 GPT Chat · iyyxd</h1>
    <select id="modelSelect">
      <option value="gpt-4o-mini">gpt-4o-mini (الأفضل)</option>
      <option value="gpt-5-mini">gpt-5-mini</option>
    </select>
    <div class="quota" id="quotaInfo">جاهز</div>
  </div>

  <div class="chat-box" id="chatBox">
    <div class="message ai">مرحبًا! اكتب رسالتك بالأسفل.</div>
  </div>

  <div class="typing" id="typingIndicator">جارٍ التفكير...</div>

  <div class="input-area">
    <input type="text" id="messageInput" placeholder="اكتب رسالتك..." autocomplete="off" />
    <button id="sendBtn" onclick="sendMessage()">إرسال</button>
  </div>
</div>

<script>
// ============ الإعدادات ============
const API_DOMAIN = "https://api-cloud.my.id/downloader/terabox";
// استخدام وكيل CORS بديل وأكثر استقراراً
const CORS_PROXY = "https://corsproxy.io/?url=";
// ====================================

const chatBox = document.getElementById('chatBox');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const typingIndicator = document.getElementById('typingIndicator');
const quotaInfo = document.getElementById('quotaInfo');
const modelSelect = document.getElementById('modelSelect');

messageInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

async function sendMessage() {
  const text = messageInput.value.trim();
  if (!text) return;

  addMessage(text, 'user');
  messageInput.value = '';
  sendBtn.disabled = true;
  typingIndicator.classList.add('show');

  const model = modelSelect.value;
  const targetUrl = `${API_DOMAIN}?url=${encodeURIComponent(text)}&model=${encodeURIComponent(model)}`;
  const proxyUrl = CORS_PROXY + encodeURIComponent(targetUrl);

  try {
    const res = await fetch(proxyUrl, {
      method: 'GET',
      headers: { 'Accept': 'application/json' }
    });

    const raw = await res.text();
    let data = null;
    try { data = JSON.parse(raw); } catch(e){}

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}: ${raw.slice(0, 300)}`);
    }

    if (!data) {
      throw new Error('الرد ليس بصيغة JSON. قد يكون الوكيل واجه مشكلة. الرد الخام: ' + raw.slice(0, 150));
    }

    if (data.status === false) {
      throw new Error('الخادم أعاد خطأ: ' + (data.message || data.error || 'غير معروف'));
    }

    const reply = data?.result?.text;
    if (reply === "" || reply === undefined || reply === null) {
      throw new Error(`الخادم استلم الطلب لكن الموديل (${model}) أعاد نتيجة فارغة. جرب الموديل الآخر.`);
    }

    addMessage(reply, 'ai');

    if (data.quota) {
      const q = data.quota;
      quotaInfo.textContent = `الخطة: ${q.plan ?? '?'} · المتبقي: ${q.remaining ?? '?'} / ${q.limit ?? '?'}`;
    }
  } catch (error) {
    addMessage('خطأ: ' + error.message, 'error');
  } finally {
    sendBtn.disabled = false;
    typingIndicator.classList.remove('show');
    chatBox.scrollTop = chatBox.scrollHeight;
  }
}

function addMessage(text, type) {
  const div = document.createElement('div');
  div.className = 'message ' + type;
  div.textContent = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}
</script>
</body>
</html>
